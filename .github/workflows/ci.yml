name: Secure Boot Simulator CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Compile source
        run: python -m compileall -q agents secure_boot_uefi simulator.py enrichment.py cli.py web/browser_bridge.py
      - name: Run tests
        run: python -m pytest -q
      - name: Exercise main CLI
        run: |
          python cli.py demo
          python cli.py chain --policy full
          python -m secure_boot_uefi.cli audit --primary 10 --secondary 4 --status NOMINAL
      - name: Validate browser source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/index.html').read_text()
          assert './app.js' in p and './style.css' in p
          for filename in ['simulator.py', 'web/browser_bridge.py', 'web/app.js', 'web/style.css']:
              assert Path(filename).is_file()
          PY
