version: '3.8'

services:
  secure-boot-uefi-pk-kek-engine:
    build: .
    container_name: secure-boot-uefi-pk-kek-engine
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
