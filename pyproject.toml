[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-boot-uefi-pk-kek-agent"
version = "2.0.0"
description = "UEFI Secure Boot Platform Key (PK) & DBX Blacklist Auditor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pydantic>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
secure-boot-uefi-pk-kek-engine = "secure_boot_uefi.cli:main"
secure-boot-sim = "cli:main"

[tool.setuptools]
packages = ["agents", "secure_boot_uefi"]
py-modules = ["cli", "simulator", "enrichment", "secure_boot_uefi_app"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/secure-boot-uefi-pk-kek-agent"
Repository = "https://github.com/abusuraihsakhri/secure-boot-uefi-pk-kek-agent.git"
