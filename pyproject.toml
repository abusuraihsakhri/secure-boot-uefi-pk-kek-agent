[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-boot-uefi-pk-kek-engine"
version = "2.0.0"
description = "UEFI Secure Boot Platform Key (PK) & DBX Blacklist Auditor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
secure-boot-uefi-pk-kek-engine = "secure_boot_uefi.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/secure-boot-uefi-pk-kek-engine"
Repository = "https://github.com/abusuraihsakhri/secure-boot-uefi-pk-kek-engine.git"
